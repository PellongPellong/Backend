aws:
  dynamodb:
    region: ap-northeast-2
    # 실제 AWS 엔드포인트 사용 시 빈 값으로 두거나 주석 처리, 로컬(테스트컨테이너/로컬스택) 시 override
    endpoint: ""
  credentials:
    # 기본은 프로파일/환경변수/EC2 메타데이터 체인 사용. 필요 시 로컬에서만 채우세요.
    accessKey: ""
    secretKey: ""

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${AWS_RDS_POSTGRESQL_ENDPOINT}:5432/restaurant
    username: ${AWS_RDS_POSTGRESQL_USERNAME}
    password: ${AWS_RDS_POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # 개발이면 update, 운영이면 validate 권장
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.orumi.pelongpelong.adapter.out.dynamodb: debug

springdoc:
  swagger-ui:
    path: /swagger
